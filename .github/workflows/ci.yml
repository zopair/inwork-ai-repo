name: In Work CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    - run: npm ci --legacy-peer-deps --no-audit --no-fund
    - run: npm test
    - run: npm run lint
    - run: npm run build
