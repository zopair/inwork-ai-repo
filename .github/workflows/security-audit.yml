name: Security and Dependency Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks OSS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" --output "/tmp/${archive}"
          curl --fail --location --silent --show-error "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output /tmp/gitleaks_checksums.txt
          grep " ${archive}$" /tmp/gitleaks_checksums.txt | sha256sum --check -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan repository history for secrets
        run: /tmp/gitleaks git --redact --exit-code 1 .

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
